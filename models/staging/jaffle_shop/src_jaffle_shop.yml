version: 2

sources:
  - name: jaffle_shop
    description: A cloned postgres database
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: Raw customer data
        columns:
          - name: id
            description: Primary key for customers
            tests:
              - unique
              - not_null
      -  name: orders
         description: Raw orders data
         columns:
           - name: id
             description: Primary key of orders
             tests: 
              - unique
              - not_null
         loaded_at_field: _etl_loaded_at
         freshness: 
           error_after:
             count: 3
             period: day
           warn_after:
             count: 1
             period: day
         
    

  